# Bhoomi v2 local stack. `docker compose up -d` then `alembic upgrade head`
# must work from a clean clone with no manual steps.

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: bhoomi/postgis-pgvector:16-3.4
    container_name: bhoomi-postgres
    environment:
      POSTGRES_USER: bhoomi
      POSTGRES_PASSWORD: bhoomi
      POSTGRES_DB: bhoomi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on a fresh volume; the first migration asserts the extensions
      # regardless. See scripts/postgres-init/01-extensions.sql.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bhoomi -d bhoomi"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: bhoomi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: bhoomi
      MINIO_ROOT_PASSWORD: bhoomi123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Sidecar: creates the bucket, then exits. `docker compose up -d` leaves it in
  # state "exited (0)" — that is success, not a crash.
  minio-bucket:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: bhoomi-minio-bucket
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 bhoomi bhoomi123 &&
      mc mb --ignore-existing local/bhoomi-assets &&
      echo 'bucket bhoomi-assets ready' &&
      exit 0
      "

volumes:
  pgdata:
  miniodata:
